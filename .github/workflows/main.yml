name: Build remote-touchpad DEB

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Upstream Repository
        uses: actions/checkout@v4
        with:
          repository: Unrud/remote-touchpad
          ref: master
          
      - name: Install CGO Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxtst-dev libxi-dev libxt-dev libxrandr-dev
          
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21'
          
      - name: Compile Binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1 
        run: |
          go build -tags "portal uinput x11" -o remote-touchpad
          
      - name: Build Debian Package
        run: |
          mkdir -p build-deb/DEBIAN
          mkdir -p build-deb/usr/bin
          
          cp remote-touchpad build-deb/usr/bin/
          chmod 755 build-deb/usr/bin/remote-touchpad
          
          cat <<EOF > build-deb/DEBIAN/control
          Package: remote-touchpad
          Version: 1.5.3
          Architecture: amd64
          Maintainer: GitHub Actions Build <actions@github.com>
          Description: Control mouse and keyboard from a smartphone
           Remote Touchpad allows you to control your PC's mouse and keyboard 
           from the web browser of a smartphone or any touchscreen device.
          EOF
          
          chmod 644 build-deb/DEBIAN/control
          dpkg-deb --build build-deb remote-touchpad_1.5.3_amd64.deb
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-touchpad-amd64-deb
          path: '*.deb'
          retention-days: 14
